apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-api
  namespace: signaltrade
  labels:
    app.kubernetes.io/name: identity-api
    app.kubernetes.io/part-of: signaltrade
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-api
        app.kubernetes.io/part-of: signaltrade
    spec:
      containers:
        - name: identity-api
          image: signaltrade-identity:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: application-runtime-config
            - secretRef:
                name: application-runtime-secret
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders: [{name: Host, value: localhost}]
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-api
  namespace: signaltrade
spec:
  selector:
    app.kubernetes.io/name: identity-api
  ports:
    - name: http
      port: 8000
      targetPort: http
