apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-api
  namespace: signaltrade
  labels: {app.kubernetes.io/name: trading-api, app.kubernetes.io/part-of: signaltrade}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: trading-api}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: trading-api, app.kubernetes.io/part-of: signaltrade}
    spec:
      containers:
        - name: trading-api
          image: signaltrade-trading:local
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: application-runtime-config}
            - secretRef: {name: application-runtime-secret}
          startupProbe: &health
            httpGet: {path: /health, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http, httpHeaders: [{name: Host, value: localhost}]}
            periodSeconds: 5
          livenessProbe: *health
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: trading-api, namespace: signaltrade}
spec:
  selector: {app.kubernetes.io/name: trading-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-worker
  namespace: signaltrade
  labels: {app.kubernetes.io/name: trading-worker, app.kubernetes.io/part-of: signaltrade}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: trading-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: trading-worker, app.kubernetes.io/part-of: signaltrade}
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: trading-worker
          image: signaltrade-trading:local
          imagePullPolicy: Never
          command: ["signaltrade-trading-worker"]
          ports: [{name: metrics, containerPort: 9102}]
          envFrom:
            - configMapRef: {name: application-runtime-config}
            - secretRef: {name: application-runtime-secret}
          startupProbe: &worker-health
            tcpSocket: {port: metrics}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: metrics}
            periodSeconds: 5
          livenessProbe: *worker-health
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
