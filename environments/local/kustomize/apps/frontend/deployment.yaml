apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: signaltrade
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: signaltrade}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: frontend}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: signaltrade}
    spec:
      containers:
        - name: frontend
          image: signaltrade-frontend:local
          imagePullPolicy: Never
          ports: [{name: http, containerPort: 80}]
          env:
            - {name: ENVIRONMENT, value: local}
          startupProbe: &health
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe: *health
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: signaltrade}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: frontend}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
