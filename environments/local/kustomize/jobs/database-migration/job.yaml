apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  namespace: signaltrade
  labels:
    app.kubernetes.io/name: database-migration
    app.kubernetes.io/part-of: signaltrade
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migration
        app.kubernetes.io/part-of: signaltrade
    spec:
      restartPolicy: Never
      containers:
        - name: migration
          image: signaltrade-migrations:local
          imagePullPolicy: Never
          args: ["upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: application-runtime-secret
                  key: DATABASE_URL
