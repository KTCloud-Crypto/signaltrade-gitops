apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: signaltrade-parameter-store, namespace: {{ .Values.namespace }}}
spec:
  provider:
    aws: {service: ParameterStore, region: {{ .Values.awsRegion }}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: monitoring, namespace: {{ .Values.namespace }}}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: signaltrade-parameter-store}
  target: {name: monitoring, creationPolicy: Owner, deletionPolicy: Retain}
  data:
    - {secretKey: GRAFANA_ADMIN_USER, remoteRef: {key: "{{ .Values.parameterPrefix }}/grafana-admin-user"}}
    - {secretKey: GRAFANA_ADMIN_PASSWORD, remoteRef: {key: "{{ .Values.parameterPrefix }}/grafana-admin-password"}}
    - {secretKey: POSTGRES_EXPORTER_DSN, remoteRef: {key: "{{ .Values.parameterPrefix }}/postgres-exporter-dsn"}}
