{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration-{{ .Release.Revision }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: database-migration, app.kubernetes.io/component: migration}
    spec:
      nodeSelector: {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ .Values.global.imageRegistry }}/{{ .Values.migration.image }}:{{ .Values.migration.tag }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - {secretRef: {name: common}}
            - {secretRef: {name: database}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
{{- end }}
