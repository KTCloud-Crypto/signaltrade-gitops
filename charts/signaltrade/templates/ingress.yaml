{{- if .Values.ingress.enabled }}
{{- $a := .Values.ingress -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # 기존 ALB를 재생성하지 않고 현재 레거시 Ingress를 GitOps가 인수합니다.
  # 세부 MSA 경로가 먼저 매칭되고 마지막 / 규칙은 롤백용 레거시 fallback입니다.
  name: backend
  namespace: {{ .Values.global.namespace }}
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: {{ $a.loadBalancerName }}
    alb.ingress.kubernetes.io/scheme: {{ $a.scheme }}
    alb.ingress.kubernetes.io/target-type: {{ $a.targetType }}
    alb.ingress.kubernetes.io/subnets: {{ $a.subnets | quote }}
    alb.ingress.kubernetes.io/inbound-cidrs: {{ $a.inboundCidrs | quote }}
    alb.ingress.kubernetes.io/security-group-prefix-lists: {{ $a.cloudFrontPrefixList | quote }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: {{ $a.certificateArn | quote }}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/use-regex-path-match: "true"
    alb.ingress.kubernetes.io/load-balancer-attributes: routing.http.drop_invalid_header_fields.enabled=true,deletion_protection.enabled=true
    alb.ingress.kubernetes.io/tags: Project=SignalTrade,Environment={{ .Values.global.environment }},Purpose=application
spec:
  ingressClassName: {{ $a.className }}
  rules:
    - host: {{ $a.host }}
      http:
        paths:
          - path: /strategies/[0-9]+/manual-sell$
            pathType: ImplementationSpecific
            backend: {service: {name: trading-api, port: {number: 8000}}}
          - {path: /health, pathType: Exact, backend: {service: {name: identity-api, port: {number: 8000}}}}
          - {path: /monitoring, pathType: Prefix, backend: {service: {name: grafana, port: {number: 80}}}}
          - {path: /auth, pathType: Prefix, backend: {service: {name: identity-api, port: {number: 8000}}}}
          - {path: /users, pathType: Prefix, backend: {service: {name: identity-api, port: {number: 8000}}}}
          - {path: /positions, pathType: Prefix, backend: {service: {name: portfolio-api, port: {number: 8000}}}}
          - {path: /analytics, pathType: Prefix, backend: {service: {name: portfolio-api, port: {number: 8000}}}}
          - {path: /paper-account, pathType: Prefix, backend: {service: {name: trading-api, port: {number: 8000}}}}
          - {path: /trades, pathType: Prefix, backend: {service: {name: trading-api, port: {number: 8000}}}}
          - {path: /strategies/executions, pathType: Prefix, backend: {service: {name: trading-api, port: {number: 8000}}}}
          - {path: /strategies/liquidate-all, pathType: Exact, backend: {service: {name: trading-api, port: {number: 8000}}}}
          - {path: /strategies/positions, pathType: Exact, backend: {service: {name: portfolio-api, port: {number: 8000}}}}
          - {path: /strategies, pathType: Prefix, backend: {service: {name: strategy-api, port: {number: 8000}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: backend, port: {number: 80}}}}
{{- end }}
