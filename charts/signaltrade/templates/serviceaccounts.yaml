{{- $root := . -}}
{{- range $name := list "identity" "strategy" "trading" "portfolio" "messaging-worker" "strategy-worker" "trading-worker" "notification-worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $root.Values.global.namespace }}
  labels:
    {{- include "signaltrade.labels" $root | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
