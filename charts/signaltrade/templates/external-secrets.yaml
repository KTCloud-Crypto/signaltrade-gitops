apiVersion: external-secrets.io/v1
kind: SecretStore
metadata: {name: {{ .Values.secret.storeName }}, namespace: {{ .Values.global.namespace }}}
spec:
  provider:
    aws: {service: SecretsManager, region: {{ .Values.global.awsRegion }}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: common, namespace: {{ .Values.global.namespace }}}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef: {kind: SecretStore, name: {{ .Values.secret.storeName }}}
  target: {name: common, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom: [{extract: {key: {{ .Values.secret.commonKey }}}}]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: database, namespace: {{ .Values.global.namespace }} }
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef: {kind: SecretStore, name: {{ .Values.secret.storeName }}}
  target: {name: database, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom: [{extract: {key: {{ .Values.secret.databaseKey }}}}]
{{- $root := . -}}
{{- range $name := list "identity" "strategy" "trading" "portfolio" "messaging" "notification" }}
{{- $serviceKey := get $root.Values.secret.serviceKeys $name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: {{ $name }}, namespace: {{ $root.Values.global.namespace }}}
spec:
  refreshInterval: {{ $root.Values.secret.refreshInterval }}
  secretStoreRef: {kind: SecretStore, name: {{ $root.Values.secret.storeName }}}
  target: {name: {{ $name }}, creationPolicy: Owner, deletionPolicy: Retain}
  dataFrom:
    - {extract: {key: {{ $root.Values.secret.commonKey }}}}
    - {extract: {key: {{ $root.Values.secret.databaseKey }}}}
    {{- if $serviceKey }}
    - {extract: {key: {{ $serviceKey }}}}
    {{- end }}
{{- end }}
