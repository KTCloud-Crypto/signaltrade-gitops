{{- $root := . -}}
{{- range $name, $api := .Values.apis }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-api
  namespace: {{ $root.Values.global.namespace }}
  labels: {app.kubernetes.io/name: "{{ $name }}-api", app.kubernetes.io/component: api}
spec:
  replicas: {{ $api.replicas }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: "{{ $name }}-api"}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: "{{ $name }}-api", app.kubernetes.io/component: api}
    spec:
      serviceAccountName: {{ $api.serviceAccount }}
      nodeSelector: {{- toYaml $root.Values.global.nodeSelector | nindent 8 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ $root.Values.global.imageRegistry }}/{{ $api.image }}:{{ $api.tag }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - secretRef: {name: {{ $name }}}
          env:
            {{- range $key, $value := $root.Values.global.commonEnv }}
            - {name: {{ $key }}, value: {{ $value | quote }}}
            {{- end }}
          startupProbe: {httpGet: {path: /health, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 5, failureThreshold: 30}
          readinessProbe: {httpGet: {path: /ready, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health, port: http, httpHeaders: [{name: Host, value: localhost}]}, periodSeconds: 30, timeoutSeconds: 5, failureThreshold: 3}
          resources: {{- toYaml $root.Values.resources.api | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata: {name: "{{ $name }}-api", namespace: {{ $root.Values.global.namespace }}}
spec:
  selector: {app.kubernetes.io/name: "{{ $name }}-api"}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: "{{ $name }}-api", namespace: {{ $root.Values.global.namespace }}}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/name: "{{ $name }}-api"}}
{{- end }}
