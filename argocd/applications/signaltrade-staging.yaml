apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: signaltrade-staging, namespace: argocd}
spec:
  project: default
  source:
    repoURL: https://github.com/KTCloud-Crypto/signaltrade-gitops.git
    targetRevision: develop
    path: charts/signaltrade
    helm: {valueFiles: [../../environments/staging/values.yaml]}
  destination: {server: https://kubernetes.default.svc, namespace: signaltrade-staging}
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true, ApplyOutOfSyncOnly=true]
    # 초기 전환 검증이 끝난 뒤 automated/prune/selfHeal을 활성화합니다.
