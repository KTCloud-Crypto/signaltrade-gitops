apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: signaltrade-observability-staging, namespace: argocd}
spec:
  project: signaltrade
  source:
    repoURL: https://github.com/KTCloud-Crypto/signaltrade-gitops.git
    targetRevision: develop
    path: addons/monitoring
    helm:
      parameters:
        - {name: namespace, value: signaltrade-staging}
        - {name: environment, value: staging}
  destination: {server: https://kubernetes.default.svc, namespace: signaltrade-staging}
  syncPolicy:
    automated: {prune: true, selfHeal: true, allowEmpty: false}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
